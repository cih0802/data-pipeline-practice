name: dbt CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 워크플로우를 수동으로도 실행해볼 수 있게 버튼 추가
  workflow_dispatch: 

jobs:
  dbt-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install dbt-snowflake

      - name: Create CI Profile
        # 'Dummy'가 아니라 실제 'Secrets'를 사용하여 Snowflake에 안전하게 연결합니다.
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          public_data_mart:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SF_ACCOUNT }}
                user: ${{ secrets.SF_USER }}
                password: ${{ secrets.SF_PASSWORD }}
                role: ${{ secrets.SF_ROLE }}
                database: ${{ secrets.SF_DATABASE }}
                warehouse: ${{ secrets.SF_WH }}
                schema: CI_TEST_SCHEMA
                threads: 4
          EOF

      - name: Run dbt deps
        working-directory: ./dbt/public_data_mart
        run: dbt deps

      - name: Run dbt compile
        # 이제 실제 Snowflake 문법 검증까지 수행합니다.
        working-directory: ./dbt/public_data_mart
        run: dbt compile --target ci